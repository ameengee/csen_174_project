services:
  - type: web
    name: csen174-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/docker/dockerfiles/Dockerfile.prod
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: JSON_LOGS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
